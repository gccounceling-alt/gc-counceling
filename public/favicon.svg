<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gcc-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <radialGradient id="gcc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="#0A0A0A"/>
  <circle cx="256" cy="256" r="230" fill="url(#gcc-glow)"/>

  <!-- Compass / Global Pathway Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gcc-gold)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#gcc-gold)" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#262626" stroke-width="2"/>

  <!-- Orbital Meridians -->
  <ellipse cx="256" cy="256" rx="90" ry="190" fill="none" stroke="url(#gcc-gold)" stroke-width="3" opacity="0.4" transform="rotate(-25 256 256)"/>
  <ellipse cx="256" cy="256" rx="190" ry="80" fill="none" stroke="url(#gcc-gold)" stroke-width="3" opacity="0.4" transform="rotate(-15 256 256)"/>

  <!-- Dynamic Pathway Arrow / North Star Compass -->
  <polygon points="256,92 278,214 256,186 234,214" fill="url(#gcc-gold)"/>
  <polygon points="256,420 274,310 256,334 238,310" fill="#CA8A04" opacity="0.7"/>

  <!-- Center Badge Plate -->
  <rect x="110" y="210" width="292" height="96" rx="20" fill="#141416" stroke="url(#gcc-gold)" stroke-width="3.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.8))"/>

  <!-- Brand Typography GCC -->
  <text x="256" y="278" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    G<tspan fill="#FACC15">C</tspan>C
  </text>
  
  <!-- Sub-label -->
  <text x="256" y="340" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#EAB308" text-anchor="middle" letter-spacing="5">
    GLOBAL CAREER
  </text>
</svg>
